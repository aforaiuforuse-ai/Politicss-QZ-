<style>
:root{--bg1:#e6f6ff;--bg2:#bfe6fa;--card:#ffffffd9;--ink:#0b3d2e;--g:#0b5d3b;--g2:#12804f;--b:#5bbcf0;--mut:#4f6f7a;--ok:#1f9d57;--no:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0a2a22;--bg2:#0e3f4f;--card:#10382fd9;--ink:#e8fbf2;--mut:#9cc7bd;--g:#34c98a;--g2:#1fa56e}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,#fff9 0,transparent 45%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:16px 16px 28px}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #0b5d3b22,inset 0 1px 0 #fff8;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-6px)}}
h1{margin:6px 0 0;font-size:34px;text-align:center;color:var(--g);letter-spacing:.5px}
.applogo{width:170px;height:170px;border-radius:50%;display:block;margin:0 auto;box-shadow:0 10px 28px #0b5d3b55}
.logo{font-size:54px;text-align:center;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px #5bbcf088)}
.sub{text-align:center;color:var(--mut);margin:4px 0 0;font-size:14px}
input{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid #5bbcf0aa;background:#ffffffb0;color:#0b3d2e;outline:none;transition:.2s}
input:focus{border-color:var(--g2);box-shadow:0 0 0 4px #12804f33}
button{font:inherit;cursor:pointer;border:0}
.btn{width:100%;margin-top:12px;padding:15px;border-radius:14px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g));box-shadow:0 8px 20px #0b5d3b44;transition:transform .15s}
.btn:active{transform:scale(.97)}
.err{color:var(--no);font-size:14px;min-height:18px;margin-top:6px}
h2{margin:0 0 10px;font-size:19px;color:var(--g)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin:6px 0;background:#5bbcf01f}
.row.me{outline:2px solid var(--g2)}
.rk{width:30px;text-align:center;font-weight:700}.nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sc{font-weight:800;color:var(--g)}
.lb{max-height:360px;overflow-y:auto}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.bar{height:10px;border-radius:9px;background:#5bbcf044;margin:10px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--g2));transition:width .5s ease}
.q{font-size:20px;font-weight:700;line-height:1.35;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:9px 0;border-radius:14px;font-size:16px;background:#ffffffc0;color:#0b3d2e;border:2px solid #5bbcf088;transition:.2s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .4s}
.opt.no{background:var(--no);color:#fff;border-color:var(--no);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{font-size:64px;text-align:center;font-weight:900;color:var(--g)}
.hide{display:none}
.foot{text-align:center;font-size:12.5px;color:var(--mut);line-height:1.6;margin-top:18px}
.foot b{color:var(--g)}
.applogo{display:block;width:170px;height:170px;margin:4px auto 0;border-radius:50%;box-shadow:0 10px 30px #0b5d3b55,0 0 0 3px #f5c52e88;animation:float 3s ease-in-out infinite}.sr{position:absolute;left:-9999px}.brand{background:#0b2a22;border-radius:18px;padding:14px;text-align:center}.brand img.wm{width:70%;max-width:260px;display:block;margin:0 auto 12px}.brand .ic{display:flex;justify-content:center;gap:26px;align-items:center}.brand .ic img{height:40px;width:auto;display:block}.copy{margin-top:10px;font-weight:700;color:var(--g)}#off{position:fixed;inset:0;z-index:99;background:#06231cee;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px}#off.hide{display:none}#off .e{font-size:64px}#off h2{color:#fff;font-size:24px;margin:0}#off p{margin:0;max-width:320px;line-height:1.5;color:#cfeee2}#off .btn{max-width:260px}.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1f9d57;margin-right:6px;box-shadow:0 0 0 3px #1f9d5744}.note{font-size:12px;color:var(--mut);text-align:center;margin-top:6px}.btn.alt{background:linear-gradient(135deg,#2a9fd8,#5bbcf0);color:#06323f}.soc{display:flex;gap:10px;flex-wrap:wrap}.soc a{flex:1;min-width:110px;text-align:center;text-decoration:none;font-weight:700;padding:12px 8px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g));box-shadow:0 6px 16px #0b5d3b33;transition:transform .15s}.soc a:active{transform:scale(.96)}
.langbar{position:relative;z-index:120;display:flex;justify-content:flex-end;margin-top:6px}.langbar button{padding:8px 16px;border-radius:20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g));box-shadow:0 6px 16px #0b5d3b33}
@keyframes blurIn{from{opacity:0;filter:blur(14px);transform:translateY(10px) scale(.98)}to{opacity:1;filter:blur(0);transform:none}}.fx{animation:blurIn .5s cubic-bezier(.2,.7,.2,1) both}.opt{transition:filter .3s,background .3s,transform .15s}
</style></head><body><div id="off" class="hide"><div class="e">📡</div><h2 data-t="offT"></h2><p id="offm"></p><button class="btn" id="retry" data-t="retry"></button></div><div class="app">
<div class="langbar"><button id="lang">🌐 Odia/Eng</button></div>

 const p=score/qs.length;
 $("em").textContent=p>=.8?"🏆":p>=.5?"🎉":"💪";
 $("msg").textContent=(p>=.8?tt("g1"):p>=.5?tt("g2"):tt("g3"))+" — "+nick;
 show("end");push();
}
async function begin(pool){
 const n=$("nick").value.trim();
 if(!n){$("err").textContent=tt("nn");$("nick").focus();return}
 $("err").textContent="";nick=n;qs=shuf(pool);i=0;score=0;ended=false;
 $("who").textContent="👤 "+nick;show("quiz");ask();
};
$("start").onclick=()=>begin(QS);$("startps").onclick=()=>begin(PS);
$("exit").onclick=()=>{if(!ended){lock=true;finish()}};
$("nick").addEventListener("keydown",e=>{if(e.key==="Enter")$("startps").click()});
$("again").onclick=()=>{show("home");drawBoard()};
function applyLang(){
 document.documentElement.lang=lang==="od"?"or":"en";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=tt(e.dataset.t));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=tt(e.dataset.ph));
 drawBoard();status();
 if(!$("quiz").classList.contains("hide")){if(!lock)draw();need()}
}
$("lang").onclick=()=>{lang=lang==="en"?"od":"en";try{localStorage.setItem("pqzl",lang)}catch(e){}applyLang()};
applyLang();
$("retry").onclick=connect;
connect();
